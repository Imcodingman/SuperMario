<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#000000">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>超级玛丽 H5</title>
  <style>
    /* 禁止长按选字和系统菜单（微信里长按会弹出「搜一搜 / 翻译」挡住按键） */
    * {
      -webkit-user-select: none !important;
      user-select: none !important;
      -webkit-touch-callout: none !important;
    }
    html, body {
      margin: 0;
      height: 100%;
      background: #000;
      overflow: hidden;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    #stage {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    canvas {
      display: block;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }
    #hint {
      display: none;
      position: fixed;
      left: 0;
      right: 0;
      text-align: center;
      color: rgba(255, 255, 255, .55);
      font-size: 13px;
      pointer-events: none;
    }
    @media (orientation: portrait) {
      #stage {
        align-items: flex-start;
        padding-top: max(env(safe-area-inset-top), 24px);
      }
      body.touch #hint { display: block; }
    }

    #controls {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      display: none;
      justify-content: space-between;
      align-items: flex-end;
      padding: 0 max(20px, env(safe-area-inset-right)) max(18px, env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left));
      pointer-events: none;
      z-index: 2;
    }
    body.touch #controls { display: flex; }
    #dpad {
      pointer-events: auto;
      width: 164px;
      height: 84px;
      display: flex;
      border-radius: 42px;
      overflow: hidden;
      background: rgba(255, 255, 255, .14);
      border: 2px solid rgba(255, 255, 255, .35);
    }
    .arrow {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 30px;
      opacity: .85;
    }
    .arrow.on { background: rgba(255, 255, 255, .28); }
    #btns {
      pointer-events: auto;
      display: flex;
      gap: 18px;
      align-items: flex-end;
    }
    .btn {
      width: 84px;
      height: 84px;
      border-radius: 50%;
      background: rgba(216, 40, 0, .5);
      border: 2px solid rgba(255, 255, 255, .5);
      color: #fff;
      font-weight: bold;
      font-size: 24px;
      line-height: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .btn small { font-size: 11px; font-weight: normal; margin-top: 3px; opacity: .85; }
    .btn.on { background: rgba(255, 90, 40, .85); }

    #topbar {
      position: fixed;
      left: 50%;
      transform: translateX(-50%);
      bottom: max(14px, env(safe-area-inset-bottom));
      display: flex;
      gap: 10px;
      z-index: 3;
    }
    #topbar button {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      border: 2px solid rgba(255, 255, 255, .45);
      background: rgba(0, 0, 0, .35);
      color: #fff;
      font-size: 16px;
      padding: 0;
      cursor: pointer;
    }
    #rotateBtn { display: none; width: auto !important; padding: 0 10px !important; font-size: 13px !important; font-weight: bold; }
    body.touch.show-rotate #rotateBtn { display: block; }
    /* 强制横屏：浏览器不跟着转屏时（例如微信），把整个页面旋转 90 度 */
    body.rotated #app {
      position: fixed;
      top: 0;
      transform-origin: 0 0;
      transform: rotate(90deg);
      overflow: hidden;
    }
    body.rotated #stage { align-items: center; padding-top: 0; }
    body.rotated #hint { display: none !important; }
    /* 文字都用伪元素画出来，页面上没有可以被长按选中的文字 */
    #hint::after, #topbar button::after { content: attr(data-label); }
    .btn::before { content: attr(data-label); }
    .btn::after { content: attr(data-sub); font-size: 11px; font-weight: normal; margin-top: 3px; opacity: .85; }
    .arrow::before {
      content: '';
      width: 0;
      height: 0;
      border-top: 12px solid transparent;
      border-bottom: 12px solid transparent;
    }
    .arrow[data-dir="left"]::before { border-right: 18px solid #fff; }
    .arrow[data-dir="right"]::before { border-left: 18px solid #fff; }
  </style>
</head>
<body>
  <div id="app">
  <div id="stage"><canvas id="game"></canvas></div>
  <div id="hint" data-label="横屏体验更佳：手机横过来，或点上方「横屏」按钮"></div>

  <div id="controls">
    <div id="dpad">
      <div class="arrow" data-dir="left"></div>
      <div class="arrow" data-dir="right"></div>
    </div>
    <div id="btns">
      <div id="btnA" class="btn" data-label="A" data-sub="跳跃"></div>
    </div>
  </div>

  <div id="topbar">
    <button id="pauseBtn" aria-label="暂停" data-label="❚❚"></button>
    <button id="muteBtn" aria-label="静音" data-label="♪"></button>
    <button id="rotateBtn" aria-label="切换横屏" data-label="横屏"></button>
  </div>
  </div>

  <script src="game.js?v15"></script>
</body>
</html>
